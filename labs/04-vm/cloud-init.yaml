#cloud-config
# Runs once on the VM's first boot.
# (Keep this file ASCII-only: 'az vm create --custom-data' fails on non-ASCII characters.)
package_update: true
packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Azure VM</title>
        <style>
          body { font-family: system-ui, sans-serif; background: #0b2a4a; color: #fff;
                 display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; }
        </style>
      </head>
      <body>
        <main>
          <h1>Hello from Azure VM!</h1>
          <p>Hostname: <b>__HOSTNAME__</b></p>
          <p>An nginx web server installed by cloud-init.</p>
        </main>
      </body>
      </html>

runcmd:
  - sed -i "s/__HOSTNAME__/$(hostname)/" /var/www/html/index.html
  - systemctl enable --now nginx
